# === Fast + high quality YouTube ===
ytdl=yes

# Prefer high-quality VP9/AV1 but avoid slow edge cases
ytdl-format=bestvideo[height<=1080][vcodec!=?av01]+bestaudio/best

# Parallel fragment download (huge speed win)
ytdl-raw-options=concurrent-fragments=8

# Start playback sooner
cache=yes
demuxer-max-bytes=128MiB
demuxer-max-back-bytes=32MiB

# Avoid slow resume/metadata logic
save-position-on-quit=no
